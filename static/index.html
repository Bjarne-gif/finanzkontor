<!DOCTYPE html>
<html lang="de" data-theme="graphit">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Finanzkontor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/ledger.css" />
</head>
<body>

  <!-- ============ ZUGANG (Login / Setup) ============ -->
  <div class="gate" id="gate" data-mode="login">
    <div class="gate-card">
      <div class="brand">
        <span class="mark">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M3 9h18" stroke="currentColor" stroke-width="1.6"/>
            <path d="M7 14h5M7 17h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="name">Finanzkontor</span>
      </div>
      <p class="sub" id="gate-sub">Willkommen zurück.</p>

      <div class="field">
        <label for="gate-pass">Passwort</label>
        <input type="password" id="gate-pass" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <label class="remember">
        <input type="checkbox" id="gate-remember" checked />
        30 Tage merken
      </label>
      <button class="btn primary" id="gate-btn">Entsperren</button>
      <p class="err" id="gate-err"></p>
      <p class="hint" id="gate-hint"></p>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div class="app" id="app">

    <!-- Topbar -->
    <header class="topbar">
      <div class="brand">
        <span class="mark">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M3 9h18" stroke="currentColor" stroke-width="1.6"/>
            <path d="M7 14h5M7 17h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="name">Finanzkontor</span>
      </div>

      <div class="spacer"></div>

      <!-- DB-Auswahl -->
      <div class="pop dbpick" id="dbpick">
        <div class="trigger" data-pop>
          <span class="lbl">Datenbank</span>
          <span class="fname" id="db-active">—</span>
          <span class="chev">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </div>
        <div class="pop-panel db-panel">
          <div class="pop-title">Gefundene Dateien</div>
          <div id="db-list"></div>
          <div class="db-sep"></div>
          <div class="pop-title">Neue Datenbank</div>
          <div class="newdb">
            <input type="text" id="db-new-name" placeholder="z. B. 2026.db" />
            <button class="btn primary" id="db-new-btn">Anlegen</button>
          </div>
        </div>
      </div>

      <!-- Theme -->
      <div class="pop" id="themepop">
        <button class="btn icon" data-pop title="Farbschema">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 100 18 3 3 0 003-3c0-.83-.34-1.58-.88-2.12-.28-.28-.12-.88.29-.88H16a5 5 0 005-5c0-3.87-4.03-7-9-7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="7.5" cy="12" r="1.1" fill="currentColor"/><circle cx="10" cy="8" r="1.1" fill="currentColor"/><circle cx="15" cy="8" r="1.1" fill="currentColor"/></svg>
        </button>
        <div class="pop-panel">
          <div class="pop-title">Farbschema</div>
          <div class="theme-grid" id="theme-grid"></div>
        </div>
      </div>

      <!-- Sperren -->
      <button class="btn icon" id="lock-btn" title="Sperren">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </header>

    <!-- Hauptfläche -->
    <main class="canvas">
      <div id="modules"></div>
    </main>

    <!-- Statusleiste -->
    <footer class="statusbar">
      <span class="s-item"><span class="v" id="s-version">v0.4.0</span></span>
      <span class="s-item"><span class="v" id="s-stage">Stufe 0</span></span>
      <span class="s-item push"><span class="k">DB</span><span class="v" id="s-db">—</span></span>
      <span class="s-item"><span class="lock">🔒</span><span class="v">verschlüsselt</span></span>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

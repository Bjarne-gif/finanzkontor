services:
  finanzkontor:
    build: .
    container_name: finanzkontor
    restart: unless-stopped
    env_file: .env
    volumes:
      # Alle privaten Daten (DB + Keyfile) liegen hier. Umzug = diesen Ordner mitnehmen.
      - ${DATA_DIR:-./data}:/app/data
    ports:
      - "${APP_PORT:-8000}:8000"
    networks:
      - default

# --- Ein Service, mehr braucht es nicht. -------------------------------------
# So wie oben läuft die App eigenständig (eigenes Netz, Port 8000). Die KI ist
# optional und in der App standardmäßig aus.
#
# Variante mit Nginx Proxy Manager + lokaler KI (Ollama) im selben Docker-Netz,
# z. B. "npm-network" (so läuft es beim Autor):
#
#   1) Unter dem Service 'networks: - default' ersetzen durch:
#
#        networks:
#          - npm-network
#
#   2) Den Block 'networks:' ganz unten ersetzen durch:
#
#        networks:
#          npm-network:
#            external: true
#            name: npm-network
#
#   3) Ollama muss im selben Netz laufen (Container-Name "ollama"). Finanzkontor
#      spricht es dann intern über  http://ollama:11434  an (AI_BASE_URL in .env).
#   4) Optional den 'ports:'-Block entfernen, wenn nur NPM zugreifen soll, und im
#      NPM einen Proxy-Host auf  finanzkontor:8000  zeigen lassen.
# -----------------------------------------------------------------------------

networks:
  default:
    name: finanzkontor_net
